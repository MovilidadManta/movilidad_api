<VirtualHost *:80>
    # Especifica el nombre del servidor que Apache debe usar. Esto es importante
    # si tienes más de un VirtualHost. Para localhost o proyectos locales,
    # puedes usar un nombre de dominio falso o localhost.
    ServerName api.movilidadmanta.gob.ec

     # Configuración SSL
    #SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/certificate.crt
    SSLCertificateKeyFile /etc/apache2/ssl/private.key

    
    # Correo del administrador del sitio, opcional pero recomendado
    ServerAdmin webmaster@localhost

    # Raíz del documento donde se encuentra el archivo index.php de Laravel (punto de entrada de la app)
    DocumentRoot /var/www/html/public

    # Configuración del directorio donde está el DocumentRoot
    <Directory /var/www/html/public>
        # Opciones de directorio. Desactivar Indexes si no quieres que los archivos sean listados
        Options FollowSymLinks
        
        # AllowOverride All permite el uso de archivos .htaccess en el directorio
        AllowOverride All 
        
        # Permitir acceso a todos los usuarios, necesario para que la aplicación web sea accesible
        Require all granted
    </Directory>

    # Registros de errores y accesos del servidor
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    # Opcional: puedes añadir una configuración de logs más detallada si es necesario
    #LogLevel warn
</VirtualHost>
